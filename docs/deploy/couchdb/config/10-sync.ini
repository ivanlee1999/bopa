; Config for bopa/notable sync. Mounted at /opt/couchdb/etc/local.d/10-sync.ini — writable,
; because the image's entrypoint chowns everything under /opt/couchdb before it starts.
; Files in local.d/ override the shipped defaults and are read at startup.

[couchdb]
; Creates _users/_replicator/_global_changes automatically instead of leaving the node
; in the "no system databases" half-configured state.
single_node = true

; No max_document_size here on purpose. The default (8,000,000) is measured against the
; JSON body with attachment data removed, so it never applies to an asset — a 60 MiB PDF
; inlined as _attachments.blob.data is accepted by a stock node. It governs ordinary
; fields, i.e. pages, which run 15–80 KB.
;
; If pictures are not syncing, this file is the wrong place to look: the limit that stops
; them is the reverse proxy's client_max_body_size (nginx defaults to 1 MB). See README.md,
; and re-run provision.sh, which probes the real ceiling through the proxy.

[chttpd]
bind_address = 0.0.0.0
; Every request must authenticate. Without this, an exposed CouchDB lets anyone read the
; database list — the single most common way a self-hosted instance leaks.
require_valid_user = true

[chttpd_auth]
require_valid_user = true
; Sessions outlive a long longpoll so the client is not re-authenticating mid-feed.
timeout = 86400

[log]
level = warning
