name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge vectors are a contract between two codebases, and the only thing that checks the
  # two implementations of the merge agree. They are duplicated by design — each suite reads its
  # own copy — so nothing but a diff catches them drifting, and they have drifted once: this repo
  # grew two page-rename vectors notable never got, and because notable's decoder dropped the
  # field they described, its suite went on passing while a rename made here was erased by the
  # BOOX. A vector only tests what both sides parse.
  #
  # docs/couch-sync-protocol.md claimed CI asserted this long before CI did. It does now.
  vectors:
    name: Merge vectors match notable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out notable
        uses: actions/checkout@v4
        with:
          repository: ivanlee1999/notable
          path: .notable
        # A transient checkout failure should warn, not red-flag an unrelated PR; the diff below
        # is what actually gates.
        continue-on-error: true

      - name: Diff the vectors
        run: |
          mine=docs/couch-sync-vectors/vectors.json
          theirs=.notable/app/src/test/resources/couch-sync-vectors/vectors.json
          if [ ! -f "$theirs" ]; then
            echo "::warning::notable checkout unavailable; vector parity not checked."
            exit 0
          fi
          if ! diff -u "$mine" "$theirs"; then
            echo "::error::couch-sync vectors differ between the repos. They are one contract;"
            echo "::error::copy the newer file across both repos in the same change."
            exit 1
          fi
          echo "couch sync vectors match"

  notablekit:
    name: NotableKit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Pure Swift package, no simulator needed — runs on the host macOS.
      - name: Test
        run: swift test --package-path NotableKit

  app:
    name: App (iPad simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      # jq ships on the current runner images, but the simulator lookup below
      # depends on it — install it rather than trust that to stay true.
      - name: Install tools
        run: |
          brew install xcodegen
          command -v jq >/dev/null || brew install jq

      # Regenerate from project.yml so CI tests the checked-in config, not a
      # possibly stale project.pbxproj.
      - name: Generate project
        working-directory: App
        run: xcodegen generate

      # Runner images change which simulators they ship, so pick one at runtime
      # instead of pinning a device name.
      - name: Pick an iPad simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
             | select(.key | contains("SimRuntime.iOS"))
             | .value[] | select(.name | startswith("iPad"))] | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "No iPad simulator available on this runner:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          # Boots if needed, returns immediately if already booted, and fails
          # here — rather than deep inside xcodebuild — if the boot goes wrong.
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"

      # The Bopa scheme's test action covers BopaTests and BopaUITests.
      - name: Test
        working-directory: App
        run: |
          xcodebuild test \
            -project Bopa.xcodeproj \
            -scheme Bopa \
            -destination "id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -resultBundlePath "$RUNNER_TEMP/Bopa.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/Bopa.xcresult
          retention-days: 7
