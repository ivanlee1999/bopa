name: Bopa
options:
  bundleIdPrefix: dev.ivan
  deploymentTarget:
    iOS: "17.0"
packages:
  NotableKit:
    path: ../NotableKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  BopaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Bopa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bopa
  BopaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bopa
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bopa.app/Bopa"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Bopa:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: NotableKit
    # Shared (committed) scheme so `xcodebuild test -scheme Bopa` runs the same
    # targets on CI as it does locally, instead of an auto-created one.
    scheme:
      testTargets:
        - BopaTests
        - BopaUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only standard HTTPS/Keychain crypto: exempt from export compliance, declared
        # here so App Store Connect stops asking on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Set at archive time (scripts/archive.sh TEAM_ID); empty keeps simulator builds
        # and CI signing-free.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivan.bopa
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 6
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac build. Catalyst rather than a native AppKit target because there is no AppKit
        # `PKCanvasView` — macOS PencilKit gives you the model and no canvas view — so a native
        # target would mean writing a stroke renderer and an input pipeline from scratch, plus a
        # paired implementation of every iOS-only SwiftUI modifier this app uses. NotableKit is
        # already `.macOS(.v13)` and imports nothing but Foundation/CoreGraphics/CryptoKit, so
        # sync, merge, storage, templates and page geometry come across for free.
        SUPPORTS_MACCATALYST: YES
        # Defaults to YES, which would make the Mac build `maccatalyst.dev.ivan.bopa` and give it
        # its own container — a second, invisible library on the same machine.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Only the Mac SDK signs with the sandbox entitlements. The iOS build is provisioned by
        # its profile, and an entitlement the profile does not grant (`app-sandbox` is a Mac
        # one) fails the archive rather than being ignored.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Bopa.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "6.0"
